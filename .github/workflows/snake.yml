# Genera cada día la animación de la serpiente a partir del gráfico de contribuciones
# y la publica en la rama "output", que es la que enlaza el README.
name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fijada por commit (v3.5.0); la imagen Docker que usa ya va fijada por digest.
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#34e4ea&color_dots=#161b22,#3a1d4a,#7a2a6a,#c23a85,#ff3d8b
            dist/snake-light.svg?color_snake=#0b8f94&color_dots=#ebedf0,#f7c4dc,#ef8fbc,#e05a9a,#d1186a

      - name: Publicar en la rama output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Actualiza la serpiente de contribuciones"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
