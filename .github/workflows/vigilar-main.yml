# La promoción de CI empuja con GITHUB_TOKEN, y eso no dispara workflows. Si este corre,
# alguien empujó a main sin pasar por develop + pruebas: se marca en rojo para revisarlo.
name: Vigilar main

on:
  push:
    branches: [main]

permissions: {}

jobs:
  push-directo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: main recibió un push directo
        env:
          QUIEN: ${{ github.actor }}
          BLINDADO: ${{ secrets.PROMOCION_KEY != '' }}
        run: |
          if [ "$BLINDADO" = true ]; then
            echo "main está blindado por ruleset (solo la deploy key de CI puede moverlo): nada que vigilar."
            exit 0
          fi
          echo "::error::main recibió un push directo de ${QUIEN}. main solo cambia por la promoción de CI desde develop."
          exit 1
