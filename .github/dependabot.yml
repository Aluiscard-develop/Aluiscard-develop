# Normas/estandares/17-ci-y-github.md: PR a develop, versiones con 14 días de antigüedad.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
