    <text x="104" y="66" class="mono" font-size="16" letter-spacing="3" fill="#34e4ea">SYSTEMS ENGINEER · COSTA RICA · 5+ YEARS</text>
    <text x="53" y="148" class="disp" font-size="68" letter-spacing="1" fill="#ff3d8b" opacity=".85">LUIS FERNANDO MEZA</text>
    <text x="59" y="148" class="disp" font-size="68" letter-spacing="1" fill="#34e4ea" opacity=".85">LUIS FERNANDO MEZA</text>
    <text x="56" y="148" class="disp" font-size="68" letter-spacing="1" fill="#ecebf5">LUIS FERNANDO MEZA</text>
    <text x="56" y="196" class="mono" font-size="20" fill="#ecebf5">Software Engineer <tspan fill="#ff3d8b">//</tspan> <tspan fill="#f4e409">Python</tspan> <tspan fill="#ff3d8b">//</tspan> <tspan fill="#f4e409">Full Stack .NET</tspan> <tspan fill="#ff3d8b">//</tspan> Automation &amp; Monitoring</text>
    <text x="56" y="248" class="mono" font-size="16" fill="#a9a5c2">&gt; aluiscard-develop.github.io<tspan class="cursor" fill="#ff3d8b"> █</tspan></text>
