<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Luis Fernando Meza Loaiza — Software Engineer · Python · Full Stack .NET · Automation &amp; Monitoring">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
